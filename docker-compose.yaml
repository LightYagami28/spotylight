services:
    spotylight:
        container_name: spotylight
        image: "ghcr.io/lightyagami28/spotylight:latest"
        restart: unless-stopped
        environment:
            - SERVER_NAME=Navidrome # nome del server predefinito
            - SERVER_LOCK=true # con true e nome/tipo/url impostati, si inseriscono solo utente e password
            - SERVER_TYPE=navidrome # valori ammessi: jellyfin, navidrome, subsonic (maiuscole indifferenti)
            - SERVER_URL=https://musica.example.com # http://indirizzo:porta oppure https://indirizzo:porta
            # - REMOTE_URL=https://condividi.example.com # URL per funzioni esterne, come la condivisione
            - LEGACY_AUTHENTICATION=false # con SERVER_LOCK=true, imposta legacyauth (true o false)
            - ANALYTICS_DISABLED=true # disattiva le statistiche d'uso
            # - CSP_EXTRA_SRC=https://lrclib.net # origini aggiuntive consentite dalla Content-Security-Policy
        ports:
            - 127.0.0.1:9180:9180
